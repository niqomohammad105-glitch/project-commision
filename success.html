<!DOCTYPE html>
<html lang="id">
<head>

    <title>Pesanan Berhasil | 3D Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen"><div class="loader-ring"></div><div class="loader-text">STUDIO</div></div>

    <div class="container" style="max-width: 600px; margin-top: 8rem; text-align: center;">
        <div class="glass-panel">
            <div style="font-size: 5rem; color: #00E5FF; margin-bottom: 1rem; text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);">✓</div>
            <h1 style="font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; color: #fff;">Terima Kasih!</h1>
            <p style="font-weight: 300; color: #A1A1AA; margin-bottom: 2.5rem;">
                Pesanan 3D Render Anda telah kami terima. Silakan selesaikan konfirmasi di WhatsApp dan kami akan segera mulai menyiapkan setup studio untuk karakter Anda.
            </p>
            <a href="index.html" class="btn-neon btn-return" style="font-size: 0.9rem;">Kembali ke Beranda</a>
        </div>
    </div>
    <script>
        window.addEventListener('load', function() { setTimeout(() => { document.getElementById('loading-screen').classList.add('fade-out'); }, 500); });
    </script>
</body>
</html>
