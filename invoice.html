<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice | 3D Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen"><div class="loader-ring"></div><div class="loader-text">STUDIO</div></div>

    <div class="container" style="max-width: 600px; margin-top: 5rem;">
        <div class="glass-panel" style="text-align: center;">
            <h2 class="section-title" style="margin-bottom: 1rem;">Invoice Pesanan</h2>
            
            <div style="background: rgba(0,0,0,0.4); padding: 1.5rem; border-radius: 12px; text-align: left; margin-bottom: 2rem;">
                <p style="margin-bottom: 0.5rem; font-weight: 300;">Halo, <strong id="invNama" style="color: #FFFFFF;"></strong>!</p>
                <p style="margin-bottom: 0.5rem; font-weight: 300; color: #AAAAAA;">Berikut adalah detail render Anda:</p>
                <ul style="list-style: none; margin-top: 1rem; opacity: 0.9; font-weight: 300;">
                    <li style="margin-bottom: 0.5rem;">Paket: <span id="invPaket" style="float: right;"></span></li>
                    <li style="margin-bottom: 0.5rem;">Jumlah: <span id="invJumlah" style="float: right;"></span></li>
                    <li style="margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed rgba(255,255,255,0.2); font-weight: 700; font-size: 1.2rem;">
                        Total Tagihan: <span id="invTotal" style="float: right; color: #FFFFFF;"></span>
                    </li>
                </ul>
            </div>

            <div style="margin-bottom: 2rem; text-align: left;">
                <h3 style="font-size: 1rem; margin-bottom: 0.5rem;">Metode Pembayaran:</h3>
                <p style="font-weight: 300; font-size: 0.9rem; color: #AAAAAA;">BCA: 1234567890 a.n. Kreator Studio</p>
                <p style="font-weight: 300; font-size: 0.9rem; color: #AAAAAA;">GoPay: 081234567890</p>
            </div>

            <button id="btnKonfirmasi" class="btn-solid btn-action" style="width: 100%; border: none; cursor: pointer;">
                Konfirmasi Pembayaran
            </button>
            <br><br>
            <a href="index.html" style="font-size: 0.8rem; text-decoration: underline; opacity: 0.6; display: inline-block; margin-top: 1.5rem;">Batalkan & Kembali</a>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() { setTimeout(() => { document.getElementById('loading-screen').classList.add('fade-out'); }, 500); });
        
        const urlParams = new URLSearchParams(window.location.search);
        const nama = urlParams.get('nama');
        const paket = urlParams.get('paket');
        const jumlah = urlParams.get('jumlah');
        const total = urlParams.get('total');

        if(!nama || !total) window.location.href = 'index.html';
        const totalRupiah = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(total);

        document.getElementById('invNama').innerText = nama;
        document.getElementById('invPaket').innerText = paket;
        document.getElementById('invJumlah').innerText = jumlah + ' render';
        document.getElementById('invTotal').innerText = totalRupiah;

        document.getElementById('btnKonfirmasi').addEventListener('click', function() {
            const pesan = `Halo! Saya sudah melakukan pembayaran komisi 3D.%0A%0A*Atas Nama:* ${nama}%0A*Total Transfer:* ${totalRupiah}%0A%0ABerikut saya lampirkan bukti transfernya.`;
            window.open(`https://wa.me/6281234567890?text=${pesan}`, '_blank');
            window.location.href = 'success.html';
        });
    </script>
</body>
</html>
